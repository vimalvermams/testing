# CI/CD Pipeline for Deploying Node.js Web App to Azure Kubernetes Service (AKS)
# This workflow automates the build, containerization, and deployment process
name: CI/CD to AKS

# Triggers: Run on push to main branch or manual dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Environment variables used throughout the workflow
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ACR_NAME: acr77225
  ACR_REGISTRY: acr77225.azurecr.io
  IMAGE_NAME: webapp
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  K8S_NAMESPACE: production

# Required permissions for the workflow
permissions:
  contents: read
  id-token: write

jobs:
  # Main job for building and deploying the application
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      # Checkout the repository code to the runner
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Set up Docker Buildx for advanced build features
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Authenticate with Azure using service principal credentials
      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Extract service principal client ID and subscription ID from credentials
      - name: Extract SPN details
        run: |
          CREDENTIALS='${{ secrets.AZURE_CREDENTIALS }}'
          CLIENT_ID=$(echo "$CREDENTIALS" | jq -r '.clientId')
          SUBSCRIPTION_ID=$(echo "$CREDENTIALS" | jq -r '.subscriptionId')
          echo "CLIENT_ID=$CLIENT_ID" >> $GITHUB_ENV
          echo "SUBSCRIPTION_ID=$SUBSCRIPTION_ID" >> $GITHUB_ENV

      # Assign Contributor role to the service principal on the resource group
      - name: Assign Contributor role to SPN on resource group
        run: |
          az role assignment create --assignee $CLIENT_ID --role Contributor --scope /subscriptions/$SUBSCRIPTION_ID/resourceGroups/${{ env.AKS_RESOURCE_GROUP }}

      # Verify that Azure login was successful and show account details
      - name: Verify Azure login
        run: |
          az account show
          az account list --all --output table

      # Enable admin access on Azure Container Registry for authentication
      - name: Enable ACR admin access
        run: |
          az acr update -n ${{ env.ACR_NAME }} --admin-enabled true

      # Get credentials for the AKS cluster to allow kubectl commands
      - name: Get AKS credentials
        uses: azure/aks-set-context@v5
        with:
          resource-group: ${{ env.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ env.AKS_CLUSTER_NAME }}
          admin: 'false'

      # Login to Azure Container Registry to push images
      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      # Build Docker image and push to Azure Container Registry
      - name: Build and push Docker image to ACR
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Create Kubernetes namespace if it doesn't exist
      - name: Create Kubernetes namespace if not exists
        run: |
          kubectl create namespace ${{ env.K8S_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      # Create image pull secret and service account for ACR access
      - name: Create ACR pull secret and service account
        run: |
          # Get ACR credentials using service principal
          ACR_USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query username -o tsv)
          ACR_PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query passwords[0].value -o tsv)
          
          # Create imagePullSecret for ACR
          kubectl create secret docker-registry acr-secret \
            --docker-server=${{ env.ACR_REGISTRY }} \
            --docker-username=$ACR_USERNAME \
            --docker-password=$ACR_PASSWORD \
            --docker-email=noreply@github.com \
            -n ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          
          # Create service account
          kubectl create serviceaccount webapp-sa \
            -n ${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Apply Kubernetes deployment and service manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # Update the deployment to use the newly built image
      - name: Update deployment with new image
        run: |
          kubectl set image deployment/webapp-deployment \
            webapp=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      # Check the status of pods and deployment before rollout
      - name: Check pod status before rollout
        run: |
          echo "Checking pods in namespace ${{ env.K8S_NAMESPACE }}..."
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
          echo ""
          echo "Deployment status:"
          kubectl get deployment webapp-deployment -n ${{ env.K8S_NAMESPACE }}

      # Wait for the deployment rollout to complete
      - name: Wait for rollout to complete
        run: |
          kubectl rollout status deployment/webapp-deployment \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=10m

      # Debug pod logs if the rollout fails
      - name: Debug pod logs if rollout fails
        if: failure()
        run: |
          echo "=== Pod Details ==="
          kubectl describe pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "=== Pod Logs ==="
          for pod in $(kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o name); do
            echo "Logs from $pod:"
            kubectl logs $pod -n ${{ env.K8S_NAMESPACE }} --all-containers=true --tail=50 || true
            echo ""
          done

      # Get the external IP of the LoadBalancer service
      - name: Get service external IP
        run: |
          echo "Waiting for LoadBalancer public IP..."
          kubectl get service webapp-service -n ${{ env.K8S_NAMESPACE }} -w &
          WAIT_PID=$!
          sleep 30
          kill $WAIT_PID 2>/dev/null || true
          
          EXTERNAL_IP=$(kubectl get service webapp-service -n ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}' 2>/dev/null || echo "pending")
          
          if [ "$EXTERNAL_IP" != "pending" ] && [ -n "$EXTERNAL_IP" ]; then
            echo "✅ Service is accessible at: http://$EXTERNAL_IP"
            echo "EXTERNAL_IP=$EXTERNAL_IP" >> $GITHUB_OUTPUT
          else
            echo "⏳ LoadBalancer IP is still pending. It may take a few minutes."
            echo "Check status with: kubectl get svc webapp-service -n ${{ env.K8S_NAMESPACE }}"
          fi

      # Verify the deployment by checking application health
      - name: Verify deployment
        run: |
          echo "Deployment Status:"
          kubectl get deployment webapp-deployment -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Pods Status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Service Status:"
          kubectl get service webapp-service -n ${{ env.K8S_NAMESPACE }}
          echo "Deployment Status:"
          kubectl get deployment webapp-deployment -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Pods Status:"
          kubectl get pods -n ${{ env.K8S_NAMESPACE }}
          echo ""
          echo "Service Status:"
          kubectl get service webapp-service -n ${{ env.K8S_NAMESPACE }}

      - name: Deployment Summary
        run: |
          echo "=== CI/CD Pipeline Completed Successfully ==="
          echo "Image: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "Cluster: ${{ env.AKS_CLUSTER_NAME }}"
          echo "Namespace: ${{ env.K8S_NAMESPACE }}"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "=============================================="